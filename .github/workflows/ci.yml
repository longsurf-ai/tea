# Purpose: Verify the standalone Tea compiler, runtime, editor projection, and documentation build.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plans are local notes: .gitignore keeps them out, and this catches a
      # forced add.
      - name: Reject committed plans
        run: |
          if git ls-files | grep -E '(^|/)plans/'; then
            echo 'Plans are local notes and must not be committed.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
